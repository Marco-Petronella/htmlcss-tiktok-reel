<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bool Tok</title>
  <link rel="icon" href="assets/img/booltok_logo.png">


  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


  <!-- TikTok Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap"
    rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>
  <!-- Container della pagina, necessario per via del layout particolare -->
  <div class="reel-page">
    <video src="assets/video/coder.mp4" autoplay muted loop></video>

    <!-- Header -->
    <header class="reel-header">
      <i class="bi bi-play-btn"></i>
      <div class="sezioni">
        <p class="sezione inactive">Esplora</p>
        <!-- /.sezione -->
        <p class="sezione inactive">Seguiti</p>
        <i class="bi bi-circle-fill circle-followed inactive"></i>
        <!-- /.sezione -->
        <p class="sezione active">Per te</p>
        <!-- /.sezione -->
      </div>
      <!-- /.sezioni -->
      <i class="bi bi-search"></i>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="side-item"><img src="assets/img/logo-transparent.png" height="50" alt="logo">
      <i class="bi bi-plus-circle-fill"></i></div>
      <!-- /.side-item -->
       <div class="side-item"><i class="bi bi-heart-fill"></i><br>588</div>
      <!-- /.side-item -->
       <div class="side-item"><i class="bi bi-chat-heart-fill"></i><br>13</div>
      <!-- /.side-item -->
       <div class="side-item"><i class="bi bi-bookmark-fill"></i><br>638</div>
      <!-- /.side-item -->
      <div class="side-item"><i class="bi bi-diamond-fill"></i><br>491</div>
      <!-- /.side-item DA CAMBIARE CON L'ICONA GIUSTA!!!-->
    </div>

    <!-- Footer -->
    <footer>
      <div class="userid">boolean.careers</div>
      <div class="caption-text">Prova il Fundamental camp. 20 ore di corso <br> gratuito per... <strong>Vedi altro</strong> </div>
    
    <div id="buttons">
      <div class="footer-button active"> <i class="bi bi-house-fill"></i>Home</div>
      <div class="footer-button inactive"> <i class="bi bi-people"></i>Amici</div>
      <div class="footer-button active"> <i class="bi bi-plus-square-fill"></i></div>
      <div class="footer-button"> <i class="bi bi-chat-square inactive"></i><i class="bi bi-circle-fill circle-mail"></i><p class="number-mail">19</p><p class="inactive">Posta in arrivo</p></div>
      <div class="footer-button inactive"> <i class="bi bi-person"></i>Profilo</div>
    </div>
      </footer>
  </div>

</body>

</html>
