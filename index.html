<!DOCTYPE html>

<head>

  <title>Bool Tok</title>

  <!-- Bootstrap Icons -->

      <div class="sezioni debug">

        <p class="sezione debug">Per te</p>

      </div>

      <i class="bi bi-search debug"></i>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="side-item debug"><img src="assets/img/boolean_logo.png" height="50" alt="logo"></div>
      <!-- /.side-item -->
       <div class="side-item debug"><i class="bi bi-heart-fill"></i><br>588</div>
      <!-- /.side-item -->

      <div class="userid">boolean.careers</div>
      <div class="caption-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus, adipisci?</div>
    
    <div id="buttons">
      <div class="footer-button"> <i class="bi bi-house-fill"></i>Home</div>
      <div class="footer-button"> <i class="bi bi-people"></i>Amici</div>
      <div class="footer-button"> <i class="bi bi-plus-square-fill"></i></div>
      <div class="footer-button"> <i class="bi bi-chat-square"></i>Posta in arrivo</div>
      <div class="footer-button"> <i class="bi bi-person"></i>Profilo</div>
    </div>
      </footer>
