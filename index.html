<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bool Tok</title>
  <link rel="icon" href="assets/img/booltok_logo.png">


  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


  <!-- TikTok Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap"
    rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="assets/css/style.css">

</head>

<body>
  <!-- Container della pagina, necessario per via del layout particolare -->
  <div class="reel-page debug">
    <video src="assets/video/coder.mp4" autoplay muted loop></video>

    <!-- Header -->
    <header class="reel-header">
      <i class="bi bi-play-btn debug"></i>
      <div class="sezioni debug">
        <p class="sezione debug">Esplora</p>
        <!-- /.sezione -->
        <p class="sezione debug">Seguiti</p>
        <!-- /.sezione -->
        <p class="sezione debug">Per te</p>
        <!-- /.sezione -->
      </div>
      <!-- /.sezioni -->
      <i class="bi bi-search debug"></i>
    </header>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="side-item debug"><img src="assets/img/boolean_logo.png" height="50"></div>
      <!-- /.side-item -->
       <div class="side-item debug"><i class="bi bi-heart-fill"></i><br>588</div>
      <!-- /.side-item -->
       <div class="side-item debug"><i class="bi bi-chat-heart-fill"></i><br>588</div>
      <!-- /.side-item -->
       <div class="side-item debug"><i class="bi bi-bookmark-fill"></i><br>588</div>
      <!-- /.side-item -->
      <div class="side-item debug"><i class="bi bi-diamond-fill"></i><br>588</div>
      <!-- /.side-item DA CAMBIARE CON L'ICONA GIUSTA!!!-->
    </div>

    <!-- Footer -->
    <footer>
      <div class="userid">boolean.careers</div>
      <div class="caption-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Delectus, adipisci?</div>
    </footer>
    <div id="buttons">
      <div class="footer-button"> <i class="lower-button debug">1</i>1</div>
      <div class="footer-button"> <i class="lower-button debug">2</i>2</div>
      <div class="footer-button"> <i class="lower-button debug">3</i>3</div>
      <div class="footer-button"> <i class="lower-button debug">4</i>4</div>
      <div class="footer-button"> <i class="lower-button debug">5</i>5</div></div>
  </div>

</body>

</html>
